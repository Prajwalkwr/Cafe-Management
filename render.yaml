services:
  - type: web
    name: mithaas-cafe-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@mithaas.cafe
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLIENT_ORIGIN
        value: https://mithaas-cafe*.vercel.app,https://cafe-management*.vercel.app,http://localhost:5173
